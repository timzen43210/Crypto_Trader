name: pionex-dryrun

on:
  schedule:
    - cron: "17 * * * *"     # UTC；每小時的第 17 分執行
  workflow_dispatch:            # 可在 Actions 頁面手動執行

permissions:
  contents: write               # 需要把結果 commit 回 repo

concurrency:
  group: pionex-dryrun
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30            # 策略5 每次多抓一輪 1 分K，放寬時限
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pionex_dryrun.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state output
          git diff --cached --quiet || git commit -m "dry run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
